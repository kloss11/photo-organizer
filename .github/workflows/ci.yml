name: CI

# Buduje i testuje projekt przy każdym pushu / PR do main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PhotoOrganizer.slnx

      - name: Build (Release)
        run: dotnet build PhotoOrganizer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PhotoOrganizer.slnx -c Release --no-build --verbosity normal
